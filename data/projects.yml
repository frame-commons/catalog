- {repo: CreoleVR/QuestLHSync, provides: [input], note: "Aligns Lighthouse trackers and controllers to the Frame's tracking"}
- {repo: Rulez777/FramePicoTracker, provides: [input], note: "Research on using PICO body trackers with the Frame"}

