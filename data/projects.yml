# Curated entries: repos the catalog lists even without a steam-frame.yml, and the part(s)
# each provides. A project's own steam-frame.yml always wins over its entry here.
# note: our one-line summary (leave it out to use the repo's GitHub description).
# Seeded 2026-11-01 from the links in kosantosbik/awesome-steam-frame, the steam-frame GitHub topic
# and our own survey. Add a repo with a pull request.

# Camera access
- {repo: Frametop/frametop, provides: [desktop, input, eyes, hands, camera], runs_on: headset,
   note: "Multi-screen KDE Plasma desktop, 3D mouse and gaze input; ships ft-camd (tracking-camera frames into a shared-memory ring) and camera hand tracking (deferred: built and runnable by hand, not in its installer)"}
- {repo: Curtis-VL/FrameEyeCameraFeed, provides: [camera, eyes], runs_on: headset, note: "Eye-camera feeds for EyeTrackVR"}
- {repo: danthedaniel/roommate-radar, provides: [camera, passthrough], note: "Highlights people nearby using the tracking cameras and object detection"}
- {repo: Sippbox/frame-passthrough-pip, provides: [camera, passthrough], note: "Passthrough camera as a picture-in-picture panel"}
- {repo: MrDarkMoon/phone-screen, provides: [camera], note: "Tracks a real phone with the tracking cameras and shows it in VR"}

