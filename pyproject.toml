[project]
name = "fc-catalog"
version = "0.1.0"
description = "Check steam-frame.yml manifests and build the frame-commons catalog of Steam Frame projects"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.1"]

[project.scripts]
fc-catalog = "fccatalog.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fccatalog"]
